<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}findex Search{% endblock %}</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --badge-bg: #f1f5f9;
      --score-bg: #ecfdf5;
      --score-fg: #047857;
      --mark-bg: #fef08a;
      --mark-fg: #713f12;
      --err-bg: #fef2f2;
      --err-border: #fecaca;
      --err-fg: #b91c1c;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f172a;
      color: #f8fafc;
      border-bottom: 1px solid #1e293b;
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      text-decoration: none;
      color: #f8fafc;
    }

    .brand strong {
      font-size: 1.3rem;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.8rem;
      color: #94a3b8;
      background: #1e293b;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    nav {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    main {
      max-width: 920px;
      width: 100%;
      margin: 1.75rem auto 2.5rem;
      padding: 0 1.25rem;
      flex: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }

    .search-form {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: stretch;
    }

    .search-input {
      flex: 1 1 280px;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
    }

    .search-input:focus,
    .search-select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .search-select {
      padding: 0.65rem 0.75rem;
      font-size: 0.92rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.65rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--badge-bg);
    }

    .btn-disabled {
      background: var(--badge-bg);
      color: var(--muted);
      border-color: var(--border);
      pointer-events: none;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0 0.75rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--badge-bg);
      color: #334155;
    }

    .pill-score {
      background: var(--score-bg);
      color: var(--score-fg);
    }

    .alert-error {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: var(--err-fg);
      font-weight: 500;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 0.75rem;
    }

    .hit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      box-shadow: var(--shadow);
    }

    .hit-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }

    .hit-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 600;
    }

    .hit-title a {
      color: var(--accent);
      text-decoration: none;
    }

    .hit-title a:hover {
      text-decoration: underline;
    }

    .hit-badges {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .snippet {
      margin: 0;
      font-size: 0.95rem;
      color: #334155;
    }

    .snippet mark {
      background: var(--mark-bg);
      color: var(--mark-fg);
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .hint-box {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hint-box code {
      background: var(--badge-bg);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      color: #1e293b;
      font-size: 0.85rem;
    }

    .doc-body {
      white-space: pre-wrap;
      font-size: 0.98rem;
      line-height: 1.75;
      color: #1e293b;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.84rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">
        <strong>findex</strong>
        <span>v{{ version }}</span>
      </a>
      <nav>
        <a href="/">Search</a>
        <a href="/stats">Stats JSON</a>
        <a href="/health">Health</a>
        <a href="/docs">OpenAPI</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    findex full-text search engine &middot; FastAPI + Jinja2 + BM25/TF-IDF
  </footer>
</body>
</html>
